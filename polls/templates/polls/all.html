{% extends "base.html" %}

{% block title %}My amazing blog{% endblock %}
<body>
{% block main %}
{% if questions %}
<ul>
    {% for question in questions %}
       <li><a href="{% url 'polls:detail' question.id %}">ID: {{question.id}} / titre : {{ question.question_text }}</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No polls are available.</p>
{% endif %}

{% endblock %}
</body>
