{% extends "base.html" %}


{% block main %}
<h1>Connexion</h1>
{% if erreur %}<p>{{ erreur }}</p>{% endif %}
<form method="post">
    {% csrf_token %}
    <label>Identifiant <input name="username" required></label>
    <label>Mot de passe <input type="password" name="password" required></label>
    <button type="submit">Se connecter</button>
</form>

{% endblock %}
